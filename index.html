<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cumpleaños mi niña</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: pink;
    }

    .navbar {
      background-color: crimson;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .navbar-brand {
      color: white;
      font-weight: bold;
      font-size: 18px;
      text-decoration: none;
    }

    .menu-toggle {
      display: none;
      font-size: 24px;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      gap: 15px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      padding: 8px;
      border-radius: 5px;
    }

    .nav-links a:hover {
      background-color: #ff4d6d;
    }

    @media (max-width: 768px) {
      .menu-toggle {
        display: block;
      }

      .nav-links {
        display: none;
        flex-direction: column;
        width: 100%;
        background-color: crimson;
        padding: 10px 0;
      }

      .nav-links.show {
        display: flex;
      }

      .nav-links a {
        padding: 10px 20px;
      }
    }

    .balloon {
      width: 120px;
      height: 150px;
      background-color: red;
      border-radius: 60px;
      position: relative;
      display: inline-block;
      margin: 20px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .balloon:hover {
      transform: scale(1.1);
    }

    .balloon:after {
      content: '';
      width: 10px;
      height: 50px;
      background-color: red;
      position: absolute;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
    }

    .confetti {
      display: none;
      position: absolute;
      width: 100%;
      height: 100%;
      background-size: cover;
      pointer-events: none;
    }

    .balloon:hover .confetti {
      display: block;
    }

    .photo-gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 30px;
    }

    .photo-gallery img {
      width: 350px;
      height: 550px;
      margin: 10px;
      border: 2px solid #ccc;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="#" class="navbar-brand">Feliz Cumpleaños Mi Niña Sandra</a>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <div class="nav-links" id="navLinks">
      <a href="carta.html">Carta</a>
      <a href="flores.html">Flores</a>
      <a href="poemas.html">Poema</a>
      <a href="mensaje.html">Mensaje</a>
    </div>
  </nav>

  <div class="text-center" style="text-align: center;">
    <div class="balloon"><div class="confetti"></div></div>
    <div class="balloon"><div class="confetti"></div></div>
    <div class="balloon"><div class="confetti"></div></div>
    <div class="balloon"><div class="confetti"></div></div>
  </div>

  <div class="photo-gallery">
    <img src="IMG-20250419-WA0174.jpg" alt="Photo 1">
    <img src="IMG-20250419-WA0175.jpg" alt="Photo 2">
    <img src="IMG-20250421-WA0240.jpg" alt="Photo 3">
    <img src="IMG-20250423-WA0164.jpg" alt="Photo 4">
    <img src="Screenshot_20250418_191325_TikTok.png" alt="Photo 5">
    <img src="Picsart_25-04-02_22-15-47-347.jpg" alt="Photo 6">
    <img src="Screenshot_20250416_190140_One UI Home.png" alt="Photo 7">
    <img src="Imagen8.avif" alt="Photo 8">
  </div>

  <script>
    function toggleMenu() {
      document.getElementById('navLinks').classList.toggle('show');
    }
  </script>

</body>
</html>
